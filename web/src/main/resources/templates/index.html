<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Repositorio Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="text-center mb-4">📚 Repositorio Web</h2>

    <!-- MENU -->
    <div class="text-center mb-4">
        <a href="/cadis" class="btn btn-primary">Cadis</a>
        <a href="/reas" class="btn btn-success">Reas</a>
        <a href="/actividades" class="btn btn-warning">Actividades</a>
        <a href="/recursos" class="btn btn-info">Recursos</a>
    </div>

    <!-- ================= CADI FORM ================= -->
    <div th:if="${cadi != null}">
        <h4 th:text="${cadi.id != null} ? 'Editar Cadi' : 'Nuevo Cadi'"></h4>

        <form th:action="@{/cadis/guardar}" th:object="${cadi}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-2">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control"></textarea>
            </div>

            <div class="mb-2">
                <label>Total Actividades</label>
                <input type="number" th:field="*{totalActividades}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/cadis" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <!-- ================= CADI LIST ================= -->
    <div th:if="${cadis != null}">
        <h4>Lista de Cadis</h4>
        <a href="/cadis/nuevo" class="btn btn-success mb-2">Nuevo Cadi</a>

        <table class="table table-bordered">
            <tr th:each="c : ${cadis}">
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.descripcion}"></td>
                <td th:text="${c.totalActividades}"></td>
                <td>
                    <a th:href="@{'/cadis/editar/' + ${c.id}}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{'/cadis/eliminar/' + ${c.id}}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </table>
    </div>

    <!-- ================= REA FORM ================= -->
    <div th:if="${rea != null}">
        <h4 th:text="${rea.id != null} ? 'Editar Rea' : 'Nueva Rea'"></h4>

        <form th:action="@{/reas/guardar}" th:object="${rea}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="mb-2">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control"></textarea>
            </div>

            <div class="mb-2">
                <label>Cadi</label>
                <select name="cadiId" class="form-control" required>
                    <option th:each="c : ${cadis}"
                            th:value="${c.id}"
                            th:text="${c.nombre}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/reas" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <!-- ================= ACTIVIDAD FORM ================= -->
    <div th:if="${actividad != null}">
        <h4 th:text="${actividad.id != null} ? 'Editar Actividad' : 'Nueva Actividad'"></h4>

        <form th:action="@{/actividades/guardar}" 
              th:object="${actividad}" 
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="mb-2">
                <label>Título</label>
                <input type="text" th:field="*{titulo}" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Descripción</label>
                <textarea th:field="*{descripcion}" class="form-control"></textarea>
            </div>

            <div class="mb-2">
                <label>Rea</label>
                <select name="reaId" class="form-control" required>
                    <option th:each="r : ${reas}"
                            th:value="${r.id}"
                            th:text="${r.nombre}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/actividades" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

</div>

</body>
</html>
