<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestor de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-5">
        <h2 class="fw-bold">📂 Mis Actividades</h2>
        <p class="text-muted">Administra y gestiona tus archivos</p>
    </div>

    <div class="row g-4">

        <div class="col-md-4" th:each="act : ${actividades}">

            <div class="card shadow border-0 h-100">
                <div class="card-body d-flex flex-column justify-content-between">

                    <div>
                        <h5 class="card-title text-center fw-semibold"
                            th:text="${act.nombre}"></h5>

                        <!-- Estado -->
                        <div th:if="${act.ruta != null}" 
                             class="text-center text-success small mt-2">
                            ✔ Archivo subido
                        </div>

                        <div th:if="${act.ruta == null}" 
                             class="text-center text-danger small mt-2">
                            ✖ No hay archivo
                        </div>
                    </div>

                    <!-- BOTONES -->
                    <div class="mt-3">

                        <!-- Si existe archivo -->
                        <div th:if="${act.ruta != null}" class="d-grid gap-2">

                            <button class="btn btn-outline-primary"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modal' + ${act.id}">
                                Ver Archivo
                            </button>

                            <a th:href="@{/descargar/{id}(id=${act.id})}"
                               class="btn btn-success">
                                Descargar
                            </a>

                            <a th:href="@{/eliminar-archivo/{id}(id=${act.id})}"
                               class="btn btn-danger">
                                Eliminar
                            </a>

                        </div>

                        <!-- Si NO existe archivo -->
                        <div th:if="${act.ruta == null}">

                            <form method="POST"
                                  th:action="@{/subir}"
                                  enctype="multipart/form-data"
                                  class="d-grid gap-2">

                                <input type="hidden"
                                       name="id"
                                       th:value="${act.id}">

                                <input type="file"
                                       name="archivo"
                                       class="form-control"
                                       required>

                                <button class="btn btn-primary">
                                    Subir Archivo
                                </button>

                            </form>

                        </div>

                    </div>

                </div>
            </div>

            <!-- MODAL SOLO PARA VER -->
            <div class="modal fade"
                 th:id="'modal' + ${act.id}"
                 tabindex="-1">

                <div class="modal-dialog modal-lg">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title"
                                th:text="${act.nombre}"></h5>
                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">

                            <iframe th:src="@{/ver/{id}(id=${act.id})}"
                                    width="100%"
                                    height="500px"
                                    style="border:none;">
                            </iframe>

                        </div>

                    </div>
                </div>

            </div>

        </div>

    </div>

    <!-- Si no hay actividades -->
    <div th:if="${#lists.isEmpty(actividades)}"
         class="text-center mt-4">
        <p class="text-muted">No hay actividades registradas.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
